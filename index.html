<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cozy Christmas Lab (8-bit)</title>
<style>
  html, body { margin: 0; height: 100%; background: #07070c; overflow: hidden; }
  body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  #stage { position: absolute; left: 0; top: 0; width: 256px; height: 144px; }
  #screen, .ctl canvas { display: block; image-rendering: crisp-edges; image-rendering: pixelated; }
  #screen { width: 100%; height: 100%; }
  /* CRT scanlines live in CSS so the canvas itself keeps its strict palette */
  #scan {
    position: absolute; inset: 0; pointer-events: none;
    background-image: linear-gradient(to bottom, rgba(0,0,0,0) 0 62%, rgba(0,0,0,.17) 62% 100%);
  }
  #scan.off { display: none; }
  /* Controls: sized and placed by layout(). The button is the hit area, the canvas is the icon. */
  #controls { position: absolute; display: flex; }
  .ctl { display: flex; align-items: center; justify-content: center; padding: 0; border: 0; background: none; cursor: pointer; opacity: .8; }
  .ctl:hover, .ctl:focus-visible { opacity: 1; }
  .ctl:focus-visible { outline: 2px solid #ffc93c; outline-offset: -2px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="screen" width="256" height="144"></canvas>
  <div id="scan"></div>
</div>
<div id="controls">
  <button class="ctl" id="scanBtn" type="button" aria-label="Scanlines" aria-pressed="true" title="Scanlines (S)"><canvas width="13" height="11"></canvas></button>
  <button class="ctl" id="pauseBtn" type="button" aria-label="Pause" title="Pause (P)"><canvas width="13" height="11"></canvas></button>
  <button class="ctl" id="mute" type="button" aria-label="Unmute sound" title="Sound (M)"><canvas width="13" height="11"></canvas></button>
</div>
<script>
'use strict';

/* =====================================================================
   1. PALETTE - the only colours the scene may use (30 entries)
   ===================================================================== */
const PAL = {
  K0: '#08080e', K1: '#15151d', K2: '#272b3b', K3: '#4a5270',   // dog blacks, iron
  S0: '#2b2119', S1: '#584431', S2: '#7e6447', S3: '#ab8d62',   // stone
  W0: '#46291a', W1: '#7a4a26', W2: '#ad7238', W3: '#d39a55',   // wood, kraft paper
  B0: '#c2a070', B1: '#e0c595', B2: '#f3e4bd',                  // walls, rug
  G0: '#11301f', G1: '#1e4f2c', G2: '#34763c',                  // pine
  F0: '#b9351b', F1: '#ef7b1c', F2: '#ffc93c', F3: '#fff3ae',   // fire, lights
  R0: '#8c1522', R1: '#d62c2c',                                 // santa red
  C0: '#465c74', C1: '#86a2bb', C2: '#c9deec', WH: '#ffffff',   // snow, glass, silver
  D0: '#1a120f', P0: '#e27a8c'                                  // deep room shadow, tongue
};
const NAMES = Object.keys(PAL);
const C = {};
NAMES.forEach((n, i) => { C[n] = i; });
const RGBA = new Uint32Array(NAMES.length);          // packed ABGR for ImageData
NAMES.forEach((n, i) => {
  const v = parseInt(PAL[n].slice(1), 16);
  RGBA[i] = (0xff000000 | ((v & 255) << 16) | (v & 0xff00) | (v >> 16)) >>> 0;
});

/* =====================================================================
   2. FRAMEBUFFER + PIXEL HELPERS (indexed colour, integer pixels only)
   ===================================================================== */
const W = 256, H = 144, TICK_MS = 100;               // 10 fps animation
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
const img = ctx.createImageData(W, H);
const out = new Uint32Array(img.data.buffer);
const buf = new Uint8Array(W * H);                   // palette indices

let cx0 = 0, cy0 = 0, cx1 = W, cy1 = H;              // clip rectangle
const setClip = (x0, y0, x1, y1) => { cx0 = x0; cy0 = y0; cx1 = x1; cy1 = y1; };
const resetClip = () => setClip(0, 0, W, H);

function px(x, y, c) {
  if (x < cx0 || y < cy0 || x >= cx1 || y >= cy1) return;
  buf[y * W + x] = c;
}
function rect(x, y, w, h, c) {
  for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) px(i, j, c);
}
function line(x0, y0, x1, y1, c) {                   // Bresenham
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let e = dx + dy;
  for (;;) {
    px(x0, y0, c);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * e;
    if (e2 >= dy) { e += dy; x0 += sx; }
    if (e2 <= dx) { e += dx; y0 += sy; }
  }
}
// 2px line: colour c with a shadow colour on its lower/right side
function tline(a, b, c, sh) {
  const steep = Math.abs(b[1] - a[1]) > Math.abs(b[0] - a[0]);
  if (sh !== undefined) line(a[0] + (steep ? 1 : 0), a[1] + (steep ? 0 : 1), b[0] + (steep ? 1 : 0), b[1] + (steep ? 0 : 1), sh);
  line(a[0], a[1], b[0], b[1], c);
}
function quad(p, c) {                                // convex quad fill
  let x0 = W, x1 = 0, y0 = H, y1 = 0;
  for (const q of p) { x0 = Math.min(x0, q[0]); x1 = Math.max(x1, q[0]); y0 = Math.min(y0, q[1]); y1 = Math.max(y1, q[1]); }
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    let pos = 0, neg = 0;
    for (let i = 0; i < 4; i++) {
      const a = p[i], b = p[(i + 1) % 4];
      const cr = (b[0] - a[0]) * (y - a[1]) - (b[1] - a[1]) * (x - a[0]);
      if (cr > 0) pos++; else if (cr < 0) neg++;
    }
    if (!pos || !neg) px(x, y, c);
  }
}
// String-array sprite. '.' is transparent; c0/c1 select a column range; off(row) shears rows sideways.
function sprite(rows, x, y, map, c0 = 0, c1 = 999, off = null) {
  for (let j = 0; j < rows.length; j++) {
    const r = rows[j], n = Math.min(r.length, c1), dx = off ? off(j) : 0;
    for (let i = c0; i < n; i++) {
      const c = map[r[i]];
      if (c !== undefined) px(x + i + dx, y + j, c);
    }
  }
}

// Ordered dithering: every gradient and glow goes through this 4x4 Bayer matrix.
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const bayer = (x, y) => BAYER[(y & 3) * 4 + (x & 3)];
// A LUT recolours existing pixels, so a glow only touches the surfaces it names.
function LUT(spec) {
  const a = new Uint8Array(NAMES.length);
  for (let i = 0; i < a.length; i++) a[i] = i;
  for (const k in spec) a[C[k]] = C[spec[k]];
  return a;
}
const ALL = c => new Uint8Array(NAMES.length).fill(c);
function dith(x, y, w, h, level, lut) {              // level 0..16 (8 = checkerboard)
  for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) {
    if (i < cx0 || j < cy0 || i >= cx1 || j >= cy1) continue;
    if (bayer(i, j) < level) buf[j * W + i] = lut[buf[j * W + i]];
  }
}
function glow(cx, cy, rx, ry, strength, lut) {       // dithered radial falloff
  for (let j = cy - ry; j <= cy + ry; j++) for (let i = cx - rx; i <= cx + rx; i++) {
    if (i < cx0 || j < cy0 || i >= cx1 || j >= cy1) continue;
    const dx = (i - cx) / rx, dy = (j - cy) / ry, d = Math.sqrt(dx * dx + dy * dy);
    if (d < 1 && bayer(i, j) < (1 - d) * strength * 16) buf[j * W + i] = lut[buf[j * W + i]];
  }
}
function hash(x, y) {                                // stateless texture noise
  let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return (h ^ (h >>> 16)) >>> 0;
}
function mulberry32(a) {                             // seeded RNG (keeps __seek deterministic)
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function present() {
  for (let i = 0; i < buf.length; i++) out[i] = RGBA[buf[i]];
  ctx.putImageData(img, 0, 0);
}

/* =====================================================================
   3. SPRITES
   ===================================================================== */
// Labrador head: the left half is drawn here and mirrored, giving a 34x28 face.
// k outline, d coat, m sheen, h highlight, e amber iris, x lit edge (fire side / window side)
const HEAD_HALF = [
  '.........kkkkkkkk',
  '.......kkdddddddd',
  '......kddddddddmm',
  '.....kdddddddmmmm',
  '....kkddddddmmmmm',
  '..kkxkddddddmmmmm',
  '.kxxdkdddddmmmmmm',
  '.kxddkdddddmmmhhh',
  'kxdddkddddmmmmmmm',
  'kxdddkddhhhhhhmmm',
  'kxdddkddkkkkkkmmm',
  'kxdddkddkekkekmmm',
  'kxdddkddkekkekmmm',
  'kxdddkdddkkkkdmmm',
  'kxdddkddddmmmmhhh',
  'kxdddkddddmmmmhhh',
  'kxdddkdddmmmmkkkk',
  '.kxddkdddmmmkkhkk',
  '.kxddkdddmmmkkkkk',
  '.kxddkdddmmmmkkkk',
  '..kxdkddmmmmmmmmk',
  '..kxdkddmhmmmmmmk',
  '...kkkddmmmmmmkkk',
  '.....kddmmmkkkddd',
  '.....kdddmkkddddd',
  '......kdddddddmmm',
  '.......kkdddddddd',
  '.........kkkkkkkk'
];
const HEAD = HEAD_HALF.map(r => r + r.split('').reverse().join('').replace(/x/g, 'y'));
const EAR_W = 5;                                      // ear columns on each side (drawn separately so they can twitch)
// Mouth overlays, placed over the lower face. p tongue, w teeth.
const PANT = [                                        // head column 11, row 22
  'kkkkkkkkkkkk',
  '.kkppppppkk.',
  '..kppppppk..',
  '...pppppp...',
  '...pppppp...',
  '....pppp....'
];
const YAWN = [                                        // head column 9, row 20
  '..kkkkkkkkkkkk..',
  '.kkwkkkkkkkkwkk.',
  'dkkkkkkkkkkkkkkd',
  'dkkkppppppppkkkd',
  'dkkppppppppppkkd',
  'dkkppppppppppkkd',
  'dkkkppppppppkkkd',
  '.dkkkppppppkkkd.',
  '..dkkkkkkkkkkd..',
  '...dddddddddd...',
  '....kkkkkkkk....'
];
// Santa hat, 44x22: red dome, fur trim across the brow, tip flopping down the left side.
const HAT = [
  '................DDDDDDDDDDD.................',
  '............DDDDRRRRRRRRRRRDDD..............',
  '..........DDRRRRRRRRRRRRRRRRRRDD............',
  '........DDRRRRRRRRRRRRRRRRRRRRRRDD..........',
  '......DDRRRRRRRRRRRRRRRRRRRRRRRRRRD.........',
  '.....DRRRRRRRRRRRRRRRRRRRRRRRRRRRRRD........',
  '....DRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRD.......',
  '...DRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRD......',
  '..DRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRD.....',
  '.DRRRRRRRRRDDDWWWWWWWWWWWWWWWWWRRRRRRRRD....',
  '.DRRRRRRRDDWWWWWWWWWWWWWWWWWWWWWWWWWRRRRD...',
  '.DRRRRRRDWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWc..',
  '.DRRRRRRDWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWc.',
  '.DRRRRRDcWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWc',
  '.DRRRRRDcWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWc',
  '.DRRRRRDcWWWWWcWWWWWWWcWWWWWWWWcWWWWWWWWWWWc',
  '.DRRRRDDccWWWWWWWWWWcWWWWWWWWWWWWWcWWWWWWWcc',
  '.DRRRRD..cccccccccccWWWWWWWWWWWWWWWWWWWWccc.',
  '.DRRRRD.............ccccccccccccccccccccc...',
  '.DRRRRD.....................................',
  '.DRRRD......................................',
  '..DRRD......................................'
];
const POM = [
  '..WWWWW..',
  '.WWWWWWW.',
  'WWWWWWWWc',
  'WWWWWWWcc',
  'WWWWWWWcc',
  'cWWWWWccc',
  '.cWWcccc.',
  '..ccccc..'
];
const HATMAP = { R: C.R1, D: C.R0, W: C.WH, c: C.C2 };

/* =====================================================================
   4. SCENE LAYERS (drawn back to front every tick)
   ===================================================================== */
const DARKER = LUT({ WH: 'B2', B2: 'B0', B0: 'S3', S3: 'S2' });

function drawWall() {
  rect(0, 0, W, 105, C.B1);
  rect(108, 102, 114, 1, C.W3);                      // baseboard
  rect(108, 103, 114, 2, C.W2);
}

function drawFloor() {
  for (let y = 105; y < H; y++) {
    const off = hash((y - 105) / 5 | 0, 9) % 40;
    for (let x = 0; x < W; x++) {
      let c = C.W2;
      if ((y - 105) % 5 === 0 || (x + off) % 43 === 0) c = C.W1;        // plank seams
      else { const n = hash(x >> 1, y) % 13; if (n === 0) c = C.W1; else if (n === 1) c = C.W3; }
      px(x, y, c);
    }
  }
  dith(196, 106, 60, 10, 5, LUT({ W2: 'W3', W1: 'W2' }));               // daylight from the door
}

function drawRug() {                                  // woven beige rug, seen in perspective
  for (let y = 116; y < H; y++) {
    const xl = Math.round(104 - (y - 116) * 0.9);
    for (let x = Math.max(0, xl); x < W; x++) {
      const yt = 116 + ((x - 100) * 0.05 | 0);
      if (y < yt) continue;
      let c = (((x >> 1) + y) & 1) ? C.B1 : C.B0;
      if (y - yt < 2 || x - xl < 2) c = C.S3;         // bound edge
      else if (hash(x, y) % 11 === 0) c = C.S3;
      else if (hash(x, y) % 17 === 1) c = C.B2;
      px(x, y, c);
    }
  }
}

/* ---- windows: snowy forest, falling snow, then the wooden frames ---- */
const GLASS = [[163, 20, 203, 75], [235, 21, 256, 96], [112, 16, 118, 62]];   // x0, y0, x1, y1 (exclusive)
const OUT_X = 108, OUT_W = W - OUT_X;                 // strip of the outside world the windows look onto

function pine(cx, base, tiers) {                     // each bough: snow draped on its upper-left, shadow beneath
  let y = base - tiers * 5 - 2;
  for (let tr = 0; tr < tiers; tr++) for (let r = 0; r < 5; r++, y++) {
    const hw = tr * 2 + r, lim = 0.78 - r * 0.15;
    for (let x = cx - hw; x <= cx + hw; x++) {
      const u = (x - cx + hw) / (2 * hw + 1);
      px(x, y, (r === 4 && u > 0.15) ? C.C0 : u < lim ? C.WH : u < lim + 0.12 ? C.C1 : C.C0);
    }
  }
  rect(cx, y, 1, 2, C.C0);
}
function drawOutside() {
  rect(OUT_X, 0, OUT_W, 100, C.C2);                   // pale winter sky
  dith(OUT_X, 0, OUT_W, 26, 7, ALL(C.WH));
  for (let x = OUT_X; x < W; x++) {                   // far treeline, snow along its crown
    const top = 30 + Math.abs((x * 3) % 14 - 7) + hash(x >> 1, 5) % 2;
    px(x, top - 1, C.WH);
    for (let y = top; y < 60; y++) px(x, y, hash(x, y) % 9 === 0 ? C.C2 : C.C1);
  }
  for (const x of [115, 183, 251]) {                  // bare trunks
    rect(x, 14, 1, 46, C.C0);
    for (let y = 20; y < 50; y += 11) { line(x, y + 4, x - 4, y, C.C0); line(x, y + 8, x + 4, y + 4, C.C0); px(x - 4, y - 1, C.WH); px(x + 4, y + 3, C.WH); }
  }
  for (const [cx, n] of [[170, 5], [195, 7], [240, 7]]) pine(cx, 60, n);
  rect(OUT_X, 58, OUT_W, 2, C.WH);                    // snow-capped deck rail
  rect(OUT_X, 60, OUT_W, 1, C.C0);
  rect(OUT_X, 61, OUT_W, 11, C.C2);
  for (let x = 160 - 52; x < W; x += 4) rect(x, 61, 1, 11, C.C0);
  rect(OUT_X, 72, OUT_W, 1, C.C0);
  rect(OUT_X, 73, OUT_W, 27, C.WH);                   // drifted snow on the deck
  dith(OUT_X, 78, OUT_W, 22, 4, ALL(C.C2));
}
function drawSnow() {
  for (const f of snow) {
    const x = Math.round(f.x), y = Math.round(f.y);
    if (x < cx0 || y < cy0 || x >= cx1 || y >= cy1) continue;
    const bg = buf[y * W + x], bright = bg === C.WH || bg === C.C2;
    if (f.layer === 0) { if (!bright) px(x, y, C.C2); continue; }
    const c = bright ? C.C1 : C.WH;                   // shaded against drifts, white against trees
    px(x, y, c);
    if (f.layer === 2) px(x + 1, y, c);               // nearest flakes are 2px wide
  }
}
function drawWindowCasings() {                       // solid wood, painted before the glass
  rect(110, 12, 11, 54, C.W2); rect(110, 12, 1, 54, C.W3); rect(120, 13, 1, 53, C.W1);   // slim window beside the chimney
  rect(111, 15, 1, 48, C.W1); rect(112, 15, 6, 1, C.W1);
  rect(159, 9, 48, 70, C.W2);
  rect(159, 9, 48, 1, C.W3); rect(159, 9, 1, 70, C.W3);
  rect(206, 10, 1, 69, C.W1); rect(160, 78, 47, 1, C.W1);
  rect(162, 13, 1, 62, C.W1); rect(163, 12, 40, 1, C.W1);
  rect(163, 13, 40, 7, C.B2); rect(163, 19, 40, 1, C.B0);               // roller blind
}
function drawWindowBars() {                           // rails and muntins, painted over the glass
  rect(112, 38, 6, 2, C.W2); rect(109, 66, 13, 2, C.W3); rect(109, 68, 13, 1, C.W1);
  rect(163, 43, 40, 2, C.W2); rect(163, 45, 40, 1, C.W1);
  rect(176, 20, 1, 55, C.W2); rect(189, 20, 1, 55, C.W2);
  rect(163, 31, 40, 1, C.W2); rect(163, 59, 40, 1, C.W2);
  rect(157, 79, 52, 2, C.W3); rect(157, 81, 52, 1, C.W1);
  // glass door on the right edge
  rect(222, 0, 13, 106, C.W2);
  rect(222, 0, 1, 106, C.W3); rect(227, 0, 1, 106, C.W1); rect(234, 10, 1, 86, C.W1);
  rect(235, 0, 21, 10, C.W2); rect(235, 9, 21, 1, C.W1);
  rect(235, 96, 21, 10, C.W2); rect(235, 96, 21, 1, C.W3); rect(238, 99, 18, 5, C.W1); rect(239, 100, 17, 3, C.W2);
  rect(235, 10, 21, 11, C.B2); rect(235, 20, 21, 1, C.B0);
  rect(245, 21, 1, 75, C.W2);
  for (const y of [35, 50, 65, 80]) rect(235, y, 21, 1, C.W2);
  rect(229, 16, 2, 4, C.C1); rect(229, 82, 2, 4, C.C1);                 // hinges
}
function drawWindows() {
  drawWindowCasings();
  for (const g of GLASS) { setClip(g[0], g[1], g[2], g[3]); drawOutside(); drawSnow(); }
  resetClip();
  drawWindowBars();
}

/* ---- Christmas tree ---- */
const TREE_X = 148, TREE_TOP = 8, TREE_BOT = 100;
// Drooping boughs: each layer swells for nine rows, then tucks back under the next.
const treeHalf = y => { const k = y - TREE_TOP; return 1.5 + k * 0.29 + ((k % 9) / 9) * 3.2; };
const LIGHTS = (() => {                               // fixed bulb positions; groups 0-1 warm, 2 red, 3 white
  const r = mulberry32(2412), a = [];
  for (let i = 0; i < 124; i++) {
    const y = 13 + (r() * 86 | 0), hw = treeHalf(y) - 2;
    a.push({ x: Math.round(TREE_X + (r() * 2 - 1) * hw), y, g: [0, 1, 0, 1, 0, 1, 2, 3][i % 8], dim: r() < 0.35 });
  }
  return a;
})();
const BAUBLES = [                                     // x, y, kind (0 red, 1 gold, 2 white)
  [150, 22, 1], [145, 31, 0], [153, 36, 2], [158, 45, 1], [150, 52, 0], [163, 57, 0], [154, 65, 2], [168, 68, 1],
  [158, 77, 0], [150, 84, 1], [173, 85, 0], [165, 92, 2], [143, 44, 2], [139, 38, 1], [160, 30, 0], [170, 78, 2],
  [176, 94, 1], [147, 70, 0], [156, 58, 1], [164, 46, 2], [152, 95, 0], [136, 52, 0]
];
const BAUBLE_COL = [[C.R1, C.R0, C.WH], [C.F2, C.F1, C.F3], [C.WH, C.C2, C.WH]];
const FLARE_ORDER = [0, 2, 1, 3];

function drawTree(t) {
  for (let y = TREE_TOP; y <= TREE_BOT; y++) {
    const lay = (y - TREE_TOP) % 9, base = treeHalf(y);
    const hl = Math.round(base + hash(y, 3) % 3 - 1), hr = Math.round(base + hash(y, 4) % 3 - 1);   // ragged silhouette
    for (let x = TREE_X - hl; x <= TREE_X + hr; x++) {
      const n = hash(x, y) % 8, edge = Math.min(x - (TREE_X - hl), TREE_X + hr - x);
      if (edge === 0 && (n & 1) && lay > 4) continue;                    // loose needle tips
      let c = C.G1;
      if (lay >= 7 || n < 2) c = C.G0;                // shadow tucked under each bough
      else if (lay < 4 && n > 4) c = C.G2;            // lit upper side
      px(x, y, c);
    }
  }
  for (const [x, y, k] of BAUBLES) {
    const [m, sh, h] = BAUBLE_COL[k];
    rect(x - 1, y - 1, 3, 3, m); px(x + 1, y + 1, sh); px(x, y + 1, sh); px(x - 1, y - 1, h); px(x, y - 2, C.G0);
  }
}
// Bulbs and star are light sources, so they are painted after the room has been shaded.
function drawTreeLights(t) {

  // string lights: the warm bulbs always glow; one group at a time flares brighter
  const flare = fx.tree > 0 ? -1 : FLARE_ORDER[(t / 5 | 0) % 4];         // -1: every group at once (tree was clicked)
  for (const l of LIGHTS) {
    const on = flare < 0 ? ((t + l.x) & 1) === 0 : l.g === flare;
    const core = l.g < 2 ? (on ? C.F3 : l.dim ? C.F1 : C.F2) : l.g === 2 ? C.R1 : (on ? C.WH : C.C2);
    const arm = l.g < 2 ? C.F2 : l.g === 2 ? C.R1 : C.C2;

  if (s > 0) { px(sx - 2, sy - 2, C.F2); px(sx + 2, sy - 2, C.F2); px(sx - 2, sy + 2, C.F2); px(sx + 2, sy + 2, C.F2); }

  if (s === 2) px(sx, sy, C.WH);
}

/* ---- fireplace: masonry, mantel, firebox ---- */
const RAMP = [C.S0, C.S1, C.S2, C.S3];
function stones(x0, y0, x1, y1, seed, light, keep = null) {
  for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) if (!keep || keep(x, y)) px(x, y, C.S0);   // mortar
  const r = mulberry32(seed);
  for (let y = y0; y < y1;) {
    const h = 8 + (r() * 6 | 0);
    for (let x = x0 - (r() * 12 | 0); x < x1;) {
      const w = 13 + (r() * 18 | 0), tone = r();
      const L = Math.max(1, Math.min(2, light(x + w / 2, y + h / 2) + (tone < 0.3 ? -1 : tone > 0.8 ? 1 : 0)));
      const base = RAMP[L], hi = RAMP[L + 1], lo = RAMP[L - 1];
      for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
        const X = x + i, Y = y + j;
        if (X < x0 || X >= x1 || Y < y0 || Y >= y1 || (keep && !keep(X, Y))) continue;
        if (Math.min(i, w - 1 - i) + Math.min(j, h - 1 - j) < 2) continue;     // chamfered corners
        let c = base;
        if (j === 0 || (i === 0 && j < h - 2)) c = hi;
        else if (j === h - 1 || i === w - 1) c = lo;
        else { const n = hash(X, Y) % 11; if (n === 0) c = lo; else if (n === 1) c = hi; }
        px(X, Y, c);
      }
      x += w + 1;
    }
    y += h + 1;
  }
}

const TONGUES = [[50, 3, 10, 2], [55, 4, 19, 0], [61, 5, 29, 1], [67, 6, 24, 2], [73, 5, 20, 3], [79, 3, 12, 1]]; // x, half-width, height, phase
const FLAME_H = [1, 0.82, 1.08, 0.9], FLAME_SWAY = [-1, 0, 1, 0];
const FLAME_LAYERS = [[C.F0, 1, 1], [C.F1, 0.72, 0.8], [C.F2, 0.46, 0.56], [C.F3, 0.22, 0.3]];
function drawFlames(t) {                              // 4-frame flicker, each tongue offset in phase
  for (const [col, ws, hs] of FLAME_LAYERS) for (const [x, w, h, p] of TONGUES) {

    for (let i = 0; i <= hh; i++) {
      const k = i / Math.max(1, hh), hw = Math.round(w * ws * Math.pow(1 - k, 0.75));
      const xo = Math.round(sway * k * k * 3) + ((i + t + p) % 6 < 2 && k > 0.4 ? 1 : 0);
      rect(x - hw + xo, 93 - i, hw * 2 + 1, 1, col);
    }
  }
}

const mantelTop = x => 19 + Math.round((x - 6) * 5 / 108);
const hearthFront = x => 124 - Math.round(x * 6 / 116);                 // front lip of the slab
const hearthBase = x => 144 - Math.round(x * 6 / 116);                  // where the hearth face meets the floor

}
function drawMantel(t) {

  bracket(22, 11, 15); bracket(91, 8, 11);

  // unlit pillar candle and a little nutcracker at the near end
  { const y = mantelTop(13); rect(12, y - 9, 4, 9, C.B2); rect(12, y - 9, 1, 9, C.WH); px(13, y - 10, C.K0); }
  { const y = mantelTop(20); rect(18, y - 11, 4, 2, C.K1); rect(18, y - 9, 4, 2, C.B0); rect(18, y - 7, 4, 1, C.WH); rect(18, y - 6, 4, 4, C.R1); px(19, y - 5, C.F2); rect(18, y - 2, 4, 2, C.K1); px(21, y - 6, C.R0); }

  for (const [x, y0] of [[31, 18], [44, 15], [46, 17], [52, 19], [65, 16], [67, 18], [82, 16], [71, 20]]) { const y = y0 + on(x); rect(x, y, 2, 2, C.R1); px(x + 1, y + 1, C.R0); }

  });
}

/* ---- hearth dressing: pumpkins, candles, fire tools ---- */
function orb(cx, cy, r, ribs) {                       // white pumpkin, lit from the fire side
  for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) {
    if (i * i + j * j > r * r + r * 0.6) continue;
    const nx = i / r, ny = j / r, l = nx * 0.6 - ny * 0.6 + (bayer(cx + i, cy + j) - 7.5) / 16 * 0.4;
    let c = l > 0.45 ? C.WH : l > -0.15 ? C.B2 : l > -0.6 ? C.B0 : C.S3;
    if (ribs && Math.abs(Math.abs(nx) - 0.55 * Math.sqrt(Math.max(0, 1 - ny * ny))) < 0.07) c = DARKER[c];
    px(cx + i, cy + j, c);
  }
  rect(cx, cy - r - 2, 2, 2, C.S1);                   // stem
}
function candleFlame(x, y, t, i) {                    // each wick keeps its own rhythm
  const f = hash((t + i * 5) / (2 + (i & 1)) | 0, i) % 3;
  glow(x, y - 1, 5, 5, 0.45, LUT({ S1: 'S2', S2: 'S3', S0: 'S1', K1: 'W0' }));
  px(x, y, C.F3);
  if (f === 2) px(x + 1, y - 1, C.F2); else px(x, y - 1, C.F2);
  if (f === 1) px(x, y - 2, C.F1);
}

// Coat shape helper: span(y) -> [left, right] or null. Fills the coat colour, outlines the

function drawDog(t, fl) {
  const bob = (t % 30) < 15 ? 0 : 1;                  // breathing
  const rim = [C.W1, C.W2, C.F1][fl];
  const map = { k: C.K0, d: C.K1, m: C.K2, h: C.K3, e: C.W2, x: rim, y: C.K3 };

  dith(102, 139, 62, 5, 8, LUT({ B0: 'S2', B1: 'S2', B2: 'S3', S3: 'S2', W2: 'W0', W1: 'W0', W3: 'W1', F1: 'W1', F2: 'W1' }));   // contact shadow

  // tail: rests on the rug, lifts when wagging
  const w = t % 95, v = t % 230;
  const wag = fx.dog > 0 ? WAG[t & 3] : w < 18 ? WAG[(w >> 1) & 3] : (v >= 140 && v < 152) ? WAG[((v - 140) >> 1) & 3] : 0;
  const mid = [[160, 134], [160, 132], [159, 130]][wag], tip = [[168, 132], [167, 127], [165, 123]][wag];
  [C.K0, C.K1, C.K2].forEach((c, i) => line(151, 137 - i, mid[0], mid[1] + 2 - i, c));
  line(mid[0], mid[1] + 1, tip[0], tip[1] + 1, C.K0); line(mid[0], mid[1], tip[0], tip[1], C.K1);
  px(tip[0], tip[1], C.K2);

  coat(haunch(143), 112, 140, 0, -1, fl, true);

  coat(paw(145, 153), 139, 142, 0, -1, fl, true);
  coat(torsoSpan, 84, 138, 0, -1, fl, false);
  coat(torsoSpan, 84, 138, 0, rim, fl, true, 84, 111);
  coat(torsoSpan, 84, 138, bob, rim, fl, true, 84, 107);                // chest and shoulders ride the breath
  glow(131, 102 - bob, 8, 13, 0.6, LUT({ K1: 'K2' }));                  // chest sheen
  for (const [x, y] of [[130, 96], [132, 99], [131, 103], [129, 101], [133, 105]]) px(x, y - bob, C.K3);
  rect(130, 119, 3, 20, C.K0); px(131, 118, C.K0);                      // gap between the front legs
  rect(123, 114, 1, 21, C.K2); rect(137, 114, 1, 21, C.K2);             // light along each leg
  rect(124, 117, 1, 8, C.K3); dith(138, 116, 1, 14, 8, LUT({ K1: 'K2' }));
  coat(paw(118, 130), 137, 142, 0, rim, fl, false);   // front paws

  for (const x of [122, 126, 136, 140]) rect(x, 140, 1, 3, C.K0);       // toes
  rect(121, 138, 7, 1, C.K2); rect(135, 138, 7, 1, C.K2);
  // collar and silver tag
  rect(123, 88 - bob, 17, 1, C.K0);
  px(125, 89 - bob, C.C1); rect(124, 90 - bob, 3, 3, C.WH); rect(126, 90 - bob, 1, 3, C.C2); rect(125, 92 - bob, 2, 1, C.C1); px(125, 93 - bob, C.C2);

  // --- head. Idle behaviour runs on fixed tick schedules; a click (fx.dog) overrides it. ---
  const happy = fx.dog > 0;
  const yawn = t % 620 - 400;                         // 0..21 while yawning, about once a minute
  const yawning = !happy && yawn >= 0 && yawn < 22, wide = yawning && yawn >= 4 && yawn < 16;
  const tilt = happy ? 1 : (t % 210 >= 60 && t % 210 < 86) ? 1 : (t % 370 >= 200 && t % 370 < 222) ? -1 : 0;
  const lean = j => tilt * (j < 10 ? 2 : j < 19 ? 1 : 0);                // row shear: crown leans furthest, jaw stays put

  sprite(HEAD, hx, hy - (tl ? 1 : 0), map, 0, EAR_W, lean); if (tl) sprite(HEAD, hx - 1, hy - 1, map, 0, EAR_W, lean);

    rect(ex + 13, hy + 15, 8, 1, C.K0); rect(ex + 12, hy + 16, 10, 1, C.K0);
    rect(ex + 13, hy + 19, 8, 1, C.K2); rect(ex + 14, hy + 18, 1, 1, C.K3); rect(ex + 19, hy + 18, 1, 1, C.K3);

  else if (yawning) sprite(PANT.slice(0, 3), hx + 11, hy + 22, { k: C.K0, p: C.K0 });
  else if (happy) sprite(PANT.slice(0, (t & 2) ? 6 : 5), hx + 11, hy + 22, mouth);

  const ax = 106 + tilt * 2, ay = 49 - bob;
  sprite(HAT, ax, ay, HATMAP);
  dith(ax + 27, ay + 1, 12, 9, 6, LUT({ R1: 'R0' }));
  dith(ax + 1, ay + 13, 3, 8, 8, LUT({ R1: 'R0' }));
  dith(ax + 13, ay + 2, 10, 2, 5, LUT({ R1: 'F1' }));                   // warm highlight on the crown
  const sway = happy ? [1, 0, -1, 0][t & 3] : [0, 1, 0, -1][(t >> 3) & 3];
  sprite(POM, ax - 1 + sway, ay + 22, HATMAP);
}

/* ---- mood lighting ----
   The room is drawn fully lit, then one pass darkens every pixel 0-3 steps down its colour
   ramp according to a precomputed light map (fire, tree, windows, a little ambient).
   The step is chosen through the Bayer matrix, so the falloff is banded dither, never a blend. */
const SHADE = LUT({ B2: 'B1', B1: 'B0', B0: 'S3', S3: 'S2', S2: 'S1', S1: 'S0', S0: 'D0', W3: 'W2', W2: 'W1', W1: 'W0', W0: 'D0',

const SHADES = [null, SHADE, SHADE.map(c => SHADE[c]), SHADE.map(c => SHADE[SHADE[c]])];
// The wood ramp is short, so it falls off at half the rate; otherwise beams and frames go black.
[['W3', 'W2', 'W2', 'W1'], ['W2', 'W2', 'W1', 'W1'], ['W1', 'W1', 'W0', 'W0'], ['W0', 'W0', 'W0', 'D0']]
  .forEach(([c, ...steps]) => steps.forEach((to, i) => { SHADES[i + 1][C[c]] = C[to]; }));

const LIGHTMAPS = [0, 1, 2].map(fl => {               // one map per firelight pulse level
  const m = new Uint8Array(W * H);
  const lamp = (x, y, cx, cy, rx, ry) => Math.max(0, 1 - Math.hypot((x - cx) / rx, (y - cy) / ry));
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {

      + (0.95 + fl * 0.06) * lamp(x, y, 66, 100, 132, 112)               // fire
      + 0.75 * lamp(x, y, 148, 56, 62, 74)                               // tree lights
      + 0.7 * lamp(x, y, 252, 70, 92, 124)                               // glass door
      + 0.5 * lamp(x, y, 183, 46, 48, 54)                                // centre window
      + 0.45 * lamp(x, y, 222, 126, 84, 40);                             // daylight pooling on the floor
    if (x < 108 && y < mantelTop(x)) L *= y < 8 ? 0.55 : 0.85;           // above the mantel, out of the fire's reach
    if (x < 117 && y > hearthFront(x)) L *= 0.7;                         // hearth face turns away from the fire
    if (EMISSIVE.some(r => x >= r[0] && x < r[2] && y >= r[1] && y < r[3])) L = 1;

    m[y * W + x] = Math.max(0, Math.min(3, Math.floor((1 - Math.min(1, L)) * 3.4 + 0.25 + bayer(x, y) / 32)));

function applyLight(fl) {
  const m = LIGHTMAPS[fl];
  for (let i = 0; i < buf.length; i++) if (m[i]) buf[i] = SHADES[m[i]][buf[i]];
}

function drawPauseIcon() {
  rect(3, 3, 9, 9, C.K0); rect(5, 5, 2, 5, C.WH); rect(8, 5, 2, 5, C.WH);
}

/* =====================================================================
   5. ANIMATION STATE
   ===================================================================== */
let tick = 0, paused = false, frozen = false;
let snow = [], embers = [], rnd = mulberry32(1);
const fx = { tree: 0, fire: 0, chair: 0, dog: 0 };    // click effects: ticks remaining
const FX_TICKS = { tree: 24, fire: 16, chair: 56, dog: 32 };
function poke(name) {                                 // called from the pointer handler
  fx[name] = FX_TICKS[name];
  if (name === 'fire') for (let i = 0; i < 6; i++) embers.push({ x: 50 + rnd() * 30, y: 86, vx: (rnd() - 0.5) * 1.2, vy: 1 + rnd() * 1.2, life: 0, max: 14 + (rnd() * 10 | 0) });
}
const FLICK = [1, 2, 1, 0, 1, 2, 2, 1, 0, 1, 1, 2, 0, 1, 2, 1];        // firelight pulse
const ROCK = [0, 1, 0, -1];

function reset() {
  tick = 0; rnd = mulberry32(1225); embers = []; snow = [];
  for (const k in fx) fx[k] = 0;
  [[64, 0.3, 0.1], [44, 0.6, 0.2], [26, 1.05, 0.35]].forEach(([n, vy, sw], layer) => {   // 3 parallax layers
    for (let i = 0; i < n; i++) snow.push({ layer, x: OUT_X + rnd() * OUT_W, y: rnd() * 104, vy: vy * (0.8 + rnd() * 0.4), sw, ph: rnd() * 40 });
  });
}
function step() {
  tick++;
  for (const k in fx) if (fx[k] > 0) fx[k]--;
  for (const f of snow) {
    f.y += f.vy; f.x += Math.sin((tick + f.ph) * 0.12) * f.sw - 0.04 * (f.layer + 1);
    if (f.y > 102) { f.y -= 104; f.x = OUT_X + rnd() * OUT_W; }
    if (f.x < OUT_X - 1) f.x += OUT_W + 1;
  }
  if (embers.length < 5 && rnd() < 0.2) embers.push({ x: 52 + rnd() * 26, y: 84, vx: (rnd() - 0.5) * 0.7, vy: 0.8 + rnd() * 0.9, life: 0, max: 12 + (rnd() * 10 | 0) });
  for (const e of embers) { e.y -= e.vy; e.x += e.vx + Math.sin((tick + e.max) * 0.9) * 0.4; e.life++; }
  embers = embers.filter(e => e.life < e.max && e.y > 58);
}
function render() {
  const t = tick, fl = fx.fire > 0 ? 2 : FLICK[(t >> 1) % FLICK.length];
  // a nudged chair swings wide, settles, then goes back to its idle drift
  const rock = fx.chair > 28 ? [0, 2, 0, -2][(t >> 1) & 3] : fx.chair > 0 ? ROCK[(t / 3 | 0) & 3] : ROCK[(t / 7 | 0) % 4];
  drawWall(); drawFloor(); drawRug();
  drawWindows();
  drawTree(t); drawPresents(); drawToys();
  rect(234, 110, 16, 3, C.K2); for (let x = 235; x < 249; x += 2) px(x, 111, C.K0);     // floor vent by the door
  glow(118, 133, 20 + fl * 2, 10, 0.5 + fl * 0.12, LUT({ W2: 'F1', W1: 'F1', B0: 'F1', B1: 'F2', S3: 'F1', W3: 'F2' }));   // firelight on the floor
  drawFireplace(t, fl);
  drawHearthItems(t);
  drawChair(rock);
  applyLight(fl);                                     // everything above is room, shaded by the light map
  drawTreeLights(t);                                  // light sources and the dog go on top, unshaded
  drawDog(t, fl);

/* =====================================================================
   6. SOUND (Web Audio, created on first unmute)
      An original 16-bar jingle (square lead, triangle bass), sleigh bells and a
      crackling fire, plus short effects for the click interactions.
   ===================================================================== */
const Sound = (() => {
  const SEMI = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  const hz = n => 440 * Math.pow(2, (12 * (+n.slice(-1) + 1) + SEMI[n[0]] - 69) / 12);
  const parse = s => {                                // "E5:1 G5:1 -:2" -> one entry per eighth note
    const a = [];
    for (const tok of s.replace(/\|/g, ' ').trim().split(/\s+/)) {
      const [n, d] = tok.split(':');
      a.push(n === '-' ? null : { f: hz(n), d: +d });
      for (let i = 1; i < +d; i++) a.push(null);
    }
    return a;
  };
  const LEAD = parse(
    // A section
    'E5:1 G5:1 C6:2 B5:1 A5:1 G5:2 | A5:1 G5:1 E5:2 D5:1 E5:1 G5:2 | F5:1 A5:1 C6:2 A5:1 G5:1 F5:2 | E5:2 D5:2 G5:4 | ' +
    'E5:1 G5:1 C6:2 D6:1 C6:1 B5:2 | A5:1 B5:1 C6:2 G5:2 E5:2 | F5:1 E5:1 D5:2 G5:1 B5:1 D6:2 | C6:4 -:2 G5:2 | ' +
    // B section
    'A5:2 A5:1 G5:1 F5:2 A5:2 | G5:2 G5:1 F5:1 E5:2 G5:2 | F5:1 G5:1 A5:1 F5:1 E5:1 F5:1 G5:1 E5:1 | D5:2 E5:2 G5:4 | ' +
    'A5:2 C6:1 A5:1 G5:2 E5:2 | F5:1 A5:1 G5:1 F5:1 E5:2 C5:2 | D5:1 E5:1 F5:1 G5:1 A5:1 B5:1 D6:2 | C6:4 -:4');
  const BASS = parse(
    'C3:2 G3:2 C3:2 G3:2 | A2:2 E3:2 A2:2 E3:2 | F2:2 C3:2 F2:2 C3:2 | G2:2 D3:2 G2:2 B2:2 | ' +
    'C3:2 G3:2 C3:2 G3:2 | A2:2 E3:2 A2:2 E3:2 | G2:2 D3:2 G2:2 D3:2 | C3:2 G3:2 C3:2 -:2 | ' +
    'F2:2 C3:2 F2:2 C3:2 | C3:2 G3:2 C3:2 G3:2 | D3:2 A2:2 G2:2 D3:2 | G2:2 D3:2 G2:2 B2:2 | ' +
    'F2:2 C3:2 C3:2 G3:2 | F2:2 C3:2 C3:2 G3:2 | G2:2 D3:2 G2:2 B2:2 | C3:2 G3:2 C3:4');

  let ac = null, master = null, hiss = null, timer = 0, next = 0, pos = 0, on = false, held = false;

  function note(type, f, t, dur, vol, f2) {           // f2: optional pitch slide target
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.setValueAtTime(vol, t + dur * 0.6);
    g.gain.linearRampToValueAtTime(0, t + dur * 0.95);

  }
  function burst(kind, freq, t, dur, vol) {           // a slice of the noise buffer through a filter
    const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = hiss; f.type = kind; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0005, t + dur);

    src.start(t, Math.random() * 1.5, dur + 0.02);

    while (next < ac.currentTime + 0.2) {
      const l = LEAD[pos], b = BASS[pos];

      if (b) note('triangle', b.f, next, b.d * EIGHTH, 0.13);
      if (pos % 2 === 0) burst('highpass', 6500, next, 0.05, pos % 4 === 0 ? 0.035 : 0.02);    // sleigh bells on the beat
      for (let i = 0; i < 2; i++) if (Math.random() < 0.3)                                    // fire pops

    hiss = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = hiss.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    // the fire's steady low roar: looped noise through a low-pass filter
    const bed = ac.createBufferSource(), lp = ac.createBiquadFilter(), g = ac.createGain();
    bed.buffer = hiss; bed.loop = true; lp.type = 'lowpass'; lp.frequency.value = 380; g.gain.value = 0.05;
    bed.connect(lp); lp.connect(g); g.connect(master); bed.start();

    if (run) { ac.resume(); next = Math.max(next, ac.currentTime + 0.06); schedule(); timer = setInterval(schedule, 50); }

    dog(t) { note('square', 420, t, 0.09, 0.09, 250); note('square', 400, t + 0.16, 0.1, 0.09, 230); },      // woof woof
    fire(t) { burst('lowpass', 1400, t, 0.5, 0.22); },                                                        // whoosh
    tree(t) { ['C6', 'E6', 'G6', 'C7'].forEach((n, i) => note('triangle', hz(n), t + i * 0.07, 0.16, 0.1)); }, // chime

    get on() { return on; },
    get scheduled() { return pos; },                  // advances while the tune is running (used by tests)
    toggle() { on = !on; sync(); return on; },
    hold(h) { held = h; sync(); },                    // pausing the scene pauses all sound
    effect(name) { if (ac && on && !held) EFFECTS[name](ac.currentTime + 0.02); }   // silent while muted
  };
})();

/* =====================================================================
   7. MAIN LOOP, LAYOUT, INPUT
   ===================================================================== */
const stage = document.getElementById('stage');
const scanEl = document.getElementById('scan');
const controls = document.getElementById('controls');
const BTN = { scan: document.getElementById('scanBtn'), pause: document.getElementById('pauseBtn'), mute: document.getElementById('mute') };
const coarse = window.matchMedia('(pointer: coarse)');

function layout() {
  // Largest whole-number scale (in device pixels) that fits; below 1x it shrinks to fit instead of cropping.
  const dpr = window.devicePixelRatio || 1;
  const k = Math.floor(Math.min(innerWidth * dpr / W, innerHeight * dpr / H));
  const s = k >= 1 ? k / dpr : Math.min(innerWidth / W, innerHeight / H);
  const w = W * s, h = H * s;
  const left = Math.round((innerWidth - w) / 2 * dpr) / dpr, top = Math.round((innerHeight - h) / 2 * dpr) / dpr;
  stage.style.width = w + 'px'; stage.style.height = h + 'px';
  stage.style.left = left + 'px'; stage.style.top = top + 'px';
  scanEl.style.backgroundSize = '100% ' + s + 'px';
  scanEl.style.visibility = k < 3 ? 'hidden' : 'visible';

  // Controls: icons scale with the pixels; on touch screens each button is at least 44px
  // and the row moves into the letterbox when there is room, so it does not cover the scene.
  const touch = coarse.matches, iw = 13 * s, ih = 11 * s;
  const bw = touch ? Math.max(44, iw) : iw, bh = touch ? Math.max(44, ih) : ih, gap = touch ? 4 : 2 * s;
  for (const b of Object.values(BTN)) {
    b.style.width = bw + 'px'; b.style.height = bh + 'px';
    b.firstChild.style.width = iw + 'px'; b.firstChild.style.height = ih + 'px';
  }
  const below = innerHeight - (top + h), beside = innerWidth - (left + w);
  const column = touch && below < bh + 8 && beside >= bw + 8;
  const rowW = column ? bw : 3 * bw + 2 * gap, rowH = column ? 3 * bh + 2 * gap : bh;
  controls.style.flexDirection = column ? 'column' : 'row';
  controls.style.gap = gap + 'px';
  let cx, cy;
  if (touch && below >= bh + 8) { cx = left + w - rowW; cy = top + h + 4; }              // under the scene
  else if (column) { cx = left + w + 4; cy = top + h - rowH; }                            // beside it
  else { cx = left + w - rowW - 3 * s; cy = top + h - rowH - 3 * s; }                     // inside the corner
  controls.style.left = Math.max(0, cx) + 'px'; controls.style.top = Math.max(0, cy) + 'px';
}

function drawIcons() {
  const P = (b, x, y, w, h, c) => { const g = b.firstChild.getContext('2d'); g.fillStyle = c; g.fillRect(x, y, w, h); };
  for (const b of Object.values(BTN)) P(b, 0, 0, 13, 11, PAL.K1);
  // scanlines: three bars, dim when off
  const sc = scanEl.classList.contains('off') ? PAL.K3 : PAL.B2;
  for (const y of [2, 5, 8]) P(BTN.scan, 2, y, 9, 1, sc);
  // pause bars, or a play triangle while paused
  if (paused) for (let i = 0; i < 4; i++) P(BTN.pause, 4 + i, 2 + i, 1, 7 - i * 2, PAL.F2);
  else { P(BTN.pause, 4, 2, 2, 7, PAL.B2); P(BTN.pause, 7, 2, 2, 7, PAL.B2); }
  // speaker with sound waves, or a red cross while muted
  const m = BTN.mute;
  P(m, 1, 4, 3, 3, PAL.B2); P(m, 4, 3, 1, 5, PAL.B2); P(m, 5, 2, 1, 7, PAL.B2); P(m, 6, 1, 1, 9, PAL.B2);
  if (Sound.on) { P(m, 8, 4, 1, 3, PAL.F2); P(m, 10, 2, 1, 1, PAL.F2); P(m, 11, 3, 1, 5, PAL.F2); P(m, 10, 8, 1, 1, PAL.F2); }
  else for (let i = 0; i < 4; i++) { P(m, 8 + i, 4 + i, 1, 1, PAL.R1); P(m, 11 - i, 4 + i, 1, 1, PAL.R1); }
}
function toggleMute() {
  const on = Sound.toggle();
  BTN.mute.setAttribute('aria-label', on ? 'Mute sound' : 'Unmute sound');
  drawIcons();
}
function togglePause() {
  paused = !paused;
  Sound.hold(paused);
  BTN.pause.setAttribute('aria-label', paused ? 'Resume' : 'Pause');
  drawIcons(); render();
}
function toggleScan() {
  const off = scanEl.classList.toggle('off');
  BTN.scan.setAttribute('aria-pressed', String(!off));
  drawIcons();
}

// Click or tap things in the room. Regions are in canvas pixels; the first match wins.
const HOTSPOTS = [
  ['dog', 106, 49, 156, 144], ['dog', 150, 118, 171, 140],
  ['fire', 36, 47, 95, 109], ['chair', 181, 52, 250, 137], ['tree', 119, 0, 181, 101]
];
function hotspotAt(e) {
  const r = canvas.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
  const h = HOTSPOTS.find(h => x >= h[1] && x < h[3] && y >= h[2] && y < h[4]);
  return h ? h[0] : null;
}
canvas.addEventListener('pointerdown', e => {
  const name = !paused && hotspotAt(e);
  if (name) { poke(name); Sound.effect(name); }
});
canvas.addEventListener('pointermove', e => { canvas.style.cursor = !paused && hotspotAt(e) ? 'pointer' : 'default'; });

let last = 0, acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(250, now - last); last = now;
  if (paused || frozen) return;
  acc += dt;
  let advanced = false;
  while (acc >= TICK_MS) { acc -= TICK_MS; step(); advanced = true; }   // fixed, chunky frame rate
  if (advanced) render();
}

BTN.mute.addEventListener('click', toggleMute);
BTN.pause.addEventListener('click', togglePause);
BTN.scan.addEventListener('click', toggleScan);
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
  const k = e.key.toLowerCase();
  if (k === 's') toggleScan();
  else if (k === 'p') togglePause();
  else if (k === 'm') toggleMute();
});
addEventListener('resize', layout);
coarse.addEventListener('change', layout);

// Debug hooks: jump to an exact tick and hold there (used for testing frames).
window.__seek = n => { reset(); for (let i = 0; i < n; i++) step(); frozen = true; render(); };
window.__play = () => { frozen = false; };

reset(); layout(); drawIcons(); render();
requestAnimationFrame(frame);
</script>
</body>
</html>
